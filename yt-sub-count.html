<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YT Sub Count</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 1920px;
    height: 1080px;
    background: #ffffff;
    overflow: hidden;
  }
  #page {
    width: 1920px;
    height: 1080px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #wrap {
    display: inline-flex;
    align-items: center;
    gap: 60px;
    font-family: 'Arial', sans-serif;
    color: #000000;
  }
  #icon {
    width: 260px;
    height: 260px;
    flex-shrink: 0;
  }
  #countWrap {
    position: relative;
    overflow: hidden;
    height: 340px;
    width: 1300px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }
  #count {
    font-size: 300px;
    font-weight: 800;
    letter-spacing: 2px;
    display: inline-block;
    white-space: nowrap;
  }
  #count.slide-up {
    animation: slideUp 0.5s ease;
  }
  #count.slide-down {
    animation: slideDown 0.5s ease;
  }
  @keyframes slideUp {
    0%   { transform: translateY(30px); opacity: 0; color: #2ecc71; }
    60%  { color: #2ecc71; }
    100% { transform: translateY(0); opacity: 1; }
  }
  @keyframes slideDown {
    0%   { transform: translateY(-30px); opacity: 0; color: #e74c3c; }
    60%  { color: #e74c3c; }
    100% { transform: translateY(0); opacity: 1; }
  }
</style>
</head>
<body>

<div id="page">
<div id="wrap">
  <svg id="icon" viewBox="0 0 28 20" xmlns="http://www.w3.org/2000/svg">
    <path fill="#FF0000" d="M27.4 3.1c-.3-1.2-1.3-2.2-2.5-2.5C22.7.1 14 .1 14 .1s-8.7 0-10.9.5C1.9.9.9 1.9.6 3.1 0 5.3 0 10 0 10s0 4.7.6 6.9c.3 1.2 1.3 2.2 2.5 2.5C5.3 19.9 14 19.9 14 19.9s8.7 0 10.9-.5c1.2-.3 2.2-1.3 2.5-2.5.6-2.2.6-6.9.6-6.9s0-4.7-.6-6.9z"/>
    <path fill="#FFFFFF" d="M11.2 14.3l7.3-4.3-7.3-4.3v8.6z"/>
  </svg>
  <div id="countWrap"><div id="count">–</div></div>
</div>
</div>

<script>
  const CHANNEL_ID = "UCePDJj21guy5eNXE3ZDPltw";
  const API_KEY = "AIzaSyAuyY03TfZ7QCHffuKOn3TGl-obDyJia_g";
  const REFRESH_MS = 60000; // 60 seconds

  let lastCount = null;

  async function fetchSubCount() {
    try {
      const url = `https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${CHANNEL_ID}&key=${API_KEY}`;
      const res = await fetch(url);
      const data = await res.json();
      const count = parseInt(data.items[0].statistics.subscriberCount, 10);
      const el = document.getElementById("count");

      if (lastCount !== null && count !== lastCount) {
        const direction = count > lastCount ? "slide-up" : "slide-down";
        el.classList.remove("slide-up", "slide-down");
        void el.offsetWidth; // restart animation
        el.textContent = formatNumber(count);
        el.classList.add(direction);
      } else {
        el.textContent = formatNumber(count);
      }

      lastCount = count;
    } catch (e) {
      console.error("Failed to fetch subscriber count:", e);
    }
  }

  function formatNumber(num) {
    num = parseInt(num, 10);
    if (num >= 1000000) return (num / 1000000).toFixed(2).replace(/\.00$/, '') + "M";
    if (num >= 1000) return (num / 1000).toFixed(2).replace(/\.00$/, '') + "K";
    return num.toString();
  }

  fetchSubCount();
  setInterval(fetchSubCount, REFRESH_MS);
</script>

</body>
</html>
